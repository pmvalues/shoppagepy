version: '3.8'

# ==============================================================================
# Shoppage Platform Production Stack (Next.js 16 + Payload CMS 3)
# ==============================================================================

services:
  # 1. Unified Next.js 16 + Payload CMS 3 Customer Front-End & Admin OS
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shoppage-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - PAYLOAD_SECRET=${PAYLOAD_SECRET:?PAYLOAD_SECRET is required}
      - DATABASE_URI=postgres://${POSTGRES_USER:?POSTGRES_USER required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB required}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD required}@redis:6379/0
      - TYPESENSE_URL=http://typesense:8108
      - TYPESENSE_API_KEY=${TYPESENSE_API_KEY:?TYPESENSE_API_KEY is required}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.6-flash}
      - SHOPPAGE_GITHUB_TOKEN=${SHOPPAGE_GITHUB_TOKEN:-}
    volumes:
      - foundation_data:/app/shoppage-commerce-intelligence-foundation/data/study
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - shoppage-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.shoppage-web.rule=Host(`${DOMAIN:-shoppage.co.za}`, `www.${DOMAIN:-shoppage.co.za}`)"
      - "traefik.http.routers.shoppage-web.entrypoints=websecure"
      - "traefik.http.routers.shoppage-web.tls=true"
      - "traefik.http.routers.shoppage-web.tls.certresolver=letsencrypt"
      - "traefik.http.services.shoppage-web.loadbalancer.server.port=3000"

  # 3. PostgreSQL 16 + pgvector Database
  postgres:
    image: pgvector/pgvector:pg16
    container_name: shoppage-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?POSTGRES_USER required} -d ${POSTGRES_DB:?POSTGRES_DB required}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - shoppage-network

  # 4. Redis 7 Cache & Queue Broker
  redis:
    image: redis:7-alpine
    container_name: shoppage-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD required}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD required}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - shoppage-network

  # 5. Typesense Search Engine
  typesense:
    image: typesense/typesense:26.0
    container_name: shoppage-typesense
    restart: unless-stopped
    command: '--data-dir /data --api-key=${TYPESENSE_API_KEY:?TYPESENSE_API_KEY required} --enable-cors'
    volumes:
      - typesense_data:/data
   networks:
     - shoppage-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  typesense_data:
    driver: local
  foundation_data:
    driver: local

networks:
  shoppage-network:
    driver: bridge
