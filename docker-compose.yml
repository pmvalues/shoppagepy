version: '3.8'

# ==============================================================================
# Shoppage 100% Pure Go Platform Production Stack
# Zero Node.js / Zero Python / Zero external databases required
# Runs on Embedded SQLite + Pure Go microservices with Caddy automatic SSL
# ==============================================================================

services:
  # 1. Main Unified Gateway & Consumer Web Front-End (:3000)
  consumer-web:
    build:
      context: .
      dockerfile: Dockerfile
      target: consumer-web
    container_name: shoppage-consumer
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - MERCHANT_OS_URL=http://merchant-os:8083
      - CHAT_GATEWAY_URL=http://chat-gateway:8080
      - SEARCH_CORE_URL=http://search-core:8082
      - FOUNDATION_DATA_DIR=/app/shoppage-commerce-intelligence-foundation/data/study
      - DATA_DIR=/app/data
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
    volumes:
      - ./data:/app/data
      - ./shoppage-commerce-intelligence-foundation/data/study:/app/shoppage-commerce-intelligence-foundation/data/study
    depends_on:
      - merchant-os
      - chat-gateway
      - search-core
    networks:
      - shoppage-network

  # 2. Merchant OS Workstation & POS (:8083)
  merchant-os:
    build:
      context: .
      dockerfile: Dockerfile
      target: merchant-os
    container_name: shoppage-merchant
    restart: unless-stopped
    environment:
      - PORT=8083
    networks:
      - shoppage-network

  # 3. Chat Gateway & WebSockets (:8080)
  chat-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      target: chat-gateway
    container_name: shoppage-chat
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
    networks:
      - shoppage-network

  # 4. Search Core SQLite Engine (:8082)
  search-core:
    build:
      context: .
      dockerfile: Dockerfile
      target: search-core
    container_name: shoppage-search
    restart: unless-stopped
    environment:
      - PORT=8082
    networks:
      - shoppage-network

  # 5. Caddy Reverse Proxy (Automatic Let's Encrypt SSL & HTTPS)
  # Uncomment below when pointing your production domain (e.g. shoppage.co.za) to this host
  # caddy:
  #   image: caddy:2-alpine
  #   container_name: shoppage-caddy
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   environment:
  #     - DOMAIN=${DOMAIN:-shoppage.co.za}
  #   volumes:
  #     - ./Caddyfile:/etc/caddy/Caddyfile
  #     - caddy_data:/data
  #     - caddy_config:/config
  #   depends_on:
  #     - consumer-web
  #   networks:
  #     - shoppage-network

networks:
  shoppage-network:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
