# ==============================================================================
# Shoppage production stack: Caddy (TLS) → one Shoppage binary → PostgreSQL.
#
# Only Caddy publishes ports. The app and database are reachable solely on the
# internal network, so client IPs cannot be spoofed by bypassing Caddy.
#
#   cp .env.example .env   # fill in every value marked REQUIRED
#   docker compose up -d --build
# ==============================================================================

services:
  caddy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-shoppage.co.za}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      shoppage:
        condition: service_healthy
    networks: [edge]

  shoppage:
    build:
      context: .
      target: shoppage
      args:
        SHOPPAGE_RELEASE: ${SHOPPAGE_RELEASE:-dev}
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      SHOPPAGE_ENV: production
      SHOPPAGE_PUBLIC_URL: https://${DOMAIN:-shoppage.co.za}
      ALLOWED_ORIGINS: https://${DOMAIN:-shoppage.co.za},https://www.${DOMAIN:-shoppage.co.za}
      DATABASE_URL: postgres://shoppage:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/shoppage?sslmode=disable
      SHOPPAGE_AUTH_SECRET: ${SHOPPAGE_AUTH_SECRET:?set SHOPPAGE_AUTH_SECRET in .env}
      SHOPPAGE_ADMIN_EMAIL: ${SHOPPAGE_ADMIN_EMAIL:?set SHOPPAGE_ADMIN_EMAIL in .env}
      SHOPPAGE_ADMIN_PASSWORD: ${SHOPPAGE_ADMIN_PASSWORD:?set SHOPPAGE_ADMIN_PASSWORD in .env}
      SHOPPAGE_STORE_ID: ${SHOPPAGE_STORE_ID:-}
      SHOPPAGE_STORE_NAME: ${SHOPPAGE_STORE_NAME:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      GEMINI_DAILY_LIMIT: ${GEMINI_DAILY_LIMIT:-2000}
      SENTRY_DSN: ${SENTRY_DSN:-}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - shoppage_state:/app/state
      # Optional bulk reference datasets (read-only). Uncomment and set
      # FOUNDATION_DATA_DIR=/app/foundation above to enable.
      # - ./shoppage-commerce-intelligence-foundation/data/study:/app/foundation:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks: [edge, data]

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: shoppage
      POSTGRES_USER: shoppage
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shoppage -d shoppage"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [data]

networks:
  edge:
  data:
    internal: true

volumes:
  caddy_data:
  caddy_config:
  shoppage_state:
  pgdata:
