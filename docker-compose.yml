version: '3.8'

# ==============================================================================
# Shoppage v7.0 Production Stack (Next.js 14 Frontend + Django 5 Backend)
# ==============================================================================

services:
  # 1. Next.js 14 Modern Customer Front-End (Google Hybrid UI, Search, PDP, Storefronts)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: shoppage-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DJANGO_API_URL=http://backend:8000
    depends_on:
      - backend
    networks:
      - shoppage-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.shoppage-web.rule=Host(`${DOMAIN:-shoppage.co.za}`, `www.${DOMAIN:-shoppage.co.za}`)"
      - "traefik.http.routers.shoppage-web.entrypoints=websecure"
      - "traefik.http.routers.shoppage-web.tls=true"
      - "traefik.http.routers.shoppage-web.tls.certresolver=letsencrypt"
      - "traefik.http.services.shoppage-web.loadbalancer.server.port=3000"

  # 2. Django 5 Master API & Admin Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shoppage-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=shoppage.settings.prod
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-shoppage_super_secure_django_secret_key_50chars}
      - ALLOWED_HOSTS=${DOMAIN:-shoppage.co.za},www.${DOMAIN:-shoppage.co.za},backend,localhost,127.0.0.1
      - DATABASE_URI=postgres://${POSTGRES_USER:-shoppage}:${POSTGRES_PASSWORD:-shoppage_secure_pass}@postgres:5432/${POSTGRES_DB:-shoppage_db}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-shoppage_redis_pass}@redis:6379/0
      - TYPESENSE_URL=http://typesense:8108
      - TYPESENSE_API_KEY=${TYPESENSE_API_KEY:-shoppage_typesense_secret_key}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - shoppage-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.shoppage-api.rule=Host(`${DOMAIN:-shoppage.co.za}`) && (PathPrefix(`/api/v1`) || PathPrefix(`/admin`) || PathPrefix(`/django-static`))"
      - "traefik.http.routers.shoppage-api.entrypoints=websecure"
      - "traefik.http.routers.shoppage-api.tls=true"
      - "traefik.http.routers.shoppage-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.shoppage-api.loadbalancer.server.port=8000"

  # 3. PostgreSQL 16 + pgvector Database
  postgres:
    image: pgvector/pgvector:pg16
    container_name: shoppage-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shoppage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shoppage_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-shoppage_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shoppage} -d ${POSTGRES_DB:-shoppage_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - shoppage-network

  # 4. Redis 7 Cache & Queue Broker
  redis:
    image: redis:7-alpine
    container_name: shoppage-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-shoppage_redis_pass}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-shoppage_redis_pass}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - shoppage-network

  # 5. Typesense Search Engine
  typesense:
    image: typesense/typesense:26.0
    container_name: shoppage-typesense
    restart: unless-stopped
    command: '--data-dir /data --api-key=${TYPESENSE_API_KEY:-shoppage_typesense_secret_key} --enable-cors'
    volumes:
      - typesense_data:/data
    ports:
      - "8108:8108"
    networks:
      - shoppage-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  typesense_data:
    driver: local

networks:
  shoppage-network:
    driver: bridge
