name: Build & Deploy Shoppage Platform

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Monorepo Packages & Next.js Web App
        run: |
          npm run build

      - name: Trigger Dokploy Auto-Deploy Webhook (if configured)
        if: env.DOKPLOY_WEBHOOK_URL != ''
        env:
          DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
        run: |
          echo "Triggering Dokploy deployment webhook..."
          curl -X POST "$DOKPLOY_WEBHOOK_URL" || true
