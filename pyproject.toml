[project]
name = "shoppage-platform"
version = "7.0.0"
description = "Shoppage v7.0 — Global Product Intelligence, Local Commerce, Media & Wagtail Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Django>=5.1.0,<5.2.0",
    "wagtail>=6.2.0,<6.3.0",
    "djangorestframework>=3.15.2",
    "django-cors-headers>=4.4.0",
    "django-filter>=24.3",
    "psycopg[binary]>=3.2.1",
    "redis>=5.0.8",
    "gunicorn>=23.0.0",
    "requests>=2.32.3",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "shoppage.settings"
python_files = ["test_*.py", "*_test.py"]
