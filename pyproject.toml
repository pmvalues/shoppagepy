[project]
name = "shoppage-platform"
version = "7.0.0"
description = "Shoppage v7.0 — Global Product Intelligence, Local Commerce, Media & Wagtail Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Django>=5.1.0,<5.2.0",
    "wagtail>=6.2.0,<6.3.0",
    "djangorestframework>=3.15.2",
    "django-cors-headers>=4.4.0",
    "django-filter>=24.3",
    "psycopg[binary]>=3.2.1",
    "redis>=5.0.8",
    "gunicorn>=23.0.0",
    "requests>=2.32.3",
    "pydantic>=2.7.0",
    "django-types>=0.22.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
    "pyright>=1.1.380",
    "pytest>=8.0.0",
    "pytest-django>=4.8.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "shoppage.settings.dev"
python_files = ["test_*.py", "*_test.py"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["apps", "shoppage"]
exclude = [
    ".venv",
    "migrations",
    "shoppage-commerce-intelligence-foundation",
    "tmp",
    "scratch",
    "node_modules",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # function call in default argument (Django decorators)
    "B904",  # within Django, raise with custom message is fine
    "RUF012",  # mutable class attributes are standard Django/DRF patterns
    "RUF001",  # en-dashes in descriptive content strings are intentional
]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["E501", "E302", "E402", "F401", "I001"]
"**/tests/*.py" = ["B011", "S101"]
"**/settings/*.py" = ["F403", "F405", "E402"]
"apps/core/management/commands/*.py" = ["B008"]
"apps/api/views.py" = ["RUF012"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
