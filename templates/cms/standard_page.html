{% extends 'base.html' %}

{% block title %}{{ page.title }} — Shoppage{% endblock %}

{% block content %}
<div class="container" style="padding-top: 3rem; padding-bottom: 5rem; max-width: 840px;">
  <h1 style="font-size: 2.25rem; font-weight: 800; color: #0F172A; margin-bottom: 1.5rem;">
    {{ page.title }}
  </h1>
  <div style="font-size: 1rem; line-height: 1.7; color: var(--text-secondary);">
    {{ page.body|safe }}
  </div>
</div>
{% endblock %}
