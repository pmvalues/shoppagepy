<!-- AI Commerce Assistant Floating Button & Panel -->
<button id="assistant-fab" class="assistant-fab" aria-label="Open Commerce Assistant">
  ✨
</button>

<div id="assistant-panel" class="assistant-panel" style="display: none;">
  <div class="assistant-header">
    <div style="display: flex; align-items: center; gap: 0.5rem;">
      <span style="font-size: 1.2rem;">✨</span>
      <div>
        <div style="font-weight: 700; font-size: 0.9rem; line-height: 1.1;">Shoppage Assistant</div>
        <div style="font-size: 0.7rem; opacity: 0.85;">Local Commerce &amp; Technical Advisor</div>
      </div>
    </div>
    <button id="assistant-close" class="assistant-close" aria-label="Close Assistant">&times;</button>
  </div>

  <div id="assistant-body" class="assistant-body">
    <div class="msg msg-bot">
      <p>Sawubona! 👋 I'm the Shoppage Commerce Assistant. I can help you find verified products, check load-shedding battery runtimes, compare local prices, and find suppliers in South African malls.</p>
    </div>
  </div>

  <!-- Suggestion chips -->
  <div style="display: flex; flex-wrap: wrap; gap: 0.35rem; padding: 0.5rem 0.75rem; background: #FFFFFF; border-top: 1px solid var(--border);">
    <button type="button" class="badge badge-blue" style="cursor: pointer; border: none;" onclick="sendAssistantMessage('Deye 5kW inverter price')">
      ☀️ Deye 5kW price
    </button>
    <button type="button" class="badge badge-green" style="cursor: pointer; border: none;" onclick="sendAssistantMessage('Solar battery under R25000')">
      🔋 Battery under 25k
    </button>
    <button type="button" class="badge badge-purple" style="cursor: pointer; border: none;" onclick="sendAssistantMessage('Dragon City solar suppliers')">
      🏢 Dragon City stores
    </button>
  </div>

  <div class="assistant-input-row">
    <input
      type="text"
      id="assistant-input"
      class="assistant-input"
      placeholder="Ask about inverters, phones, budget..."
    />
    <button id="assistant-send" class="btn btn-primary" style="padding: 0.6rem 0.9rem;">
      Send
    </button>
  </div>
</div>
